<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF7F1" />

    <!-- Tipografía: Spectral (títulos/cifras), Archivo (cuerpo/UI), Roboto Mono (captions) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;500;600&family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Inversión Tsalach 2026 | Oportunidad Inmobiliaria en Querétaro</title>
    <meta
      name="description"
      content="Micrositio de análisis para inversionistas sobre oportunidad de adquisición y desarrollo inmobiliario en Querétaro, con escenarios financieros, comparables de mercado y proyección de absorción."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://inversion-tsalach-2026.netlify.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Inversión Tsalach 2026" />
    <meta property="og:title" content="Inversión Tsalach 2026 | Oportunidad Inmobiliaria en Querétaro" />
    <meta
      property="og:description"
      content="Oportunidad de adquisición y desarrollo inmobiliario en Querétaro. Escenarios financieros, comparables de mercado y proyección de absorción. Modelo preliminar sujeto a validación."
    />
    <meta property="og:url" content="https://inversion-tsalach-2026.netlify.app/" />
    <meta property="og:image" content="https://inversion-tsalach-2026.netlify.app/og-image.svg" />
    <meta property="og:locale" content="es_MX" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Inversión Tsalach 2026 | Oportunidad Inmobiliaria en Querétaro" />
    <meta
      name="twitter:description"
      content="Oportunidad de adquisición y desarrollo inmobiliario en Querétaro. Escenarios financieros, comparables de mercado y proyección de absorción."
    />
    <meta name="twitter:image" content="https://inversion-tsalach-2026.netlify.app/og-image.svg" />
  </head>
  <body>
    <!--
      Formulario oculto para detección de Netlify Forms en build.
      El formulario visible (React) envía por AJAX a este mismo "form-name".
      Ver README → "Cómo conectar el formulario con Netlify Forms".
    -->
    <form name="contacto" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="nombre" />
      <input type="text" name="empresa" />
      <input type="tel" name="telefono" />
      <input type="email" name="correo" />
      <input type="text" name="monto" />
      <textarea name="mensaje"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
